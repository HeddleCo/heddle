[workspace]
members = [
    "crates/cli",
    "crates/cli-args",
    "crates/cli-contract",
    "crates/cli-render",
    "crates/config",
    "crates/ci-config",
    "crates/ci-engine",
    "crates/verbs",
    "crates/crypto",
    "crates/devtools",
    "crates/hosted-client",
    "crates/ingest",
    "crates/merge",
    "crates/mount",
    "crates/format",
    "crates/fs-prims",
    "crates/git-projection",
    "crates/object-model",
    "crates/objects",
    "crates/oplog",
    "crates/pack",
    "crates/perf-contract",
    "crates/wire",
    "crates/refs",
    "crates/repo",
    "crates/semantic",
    "crates/semantic-recovery",
    "crates/state-review",
]
default-members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "0.13.0"
edition = "2024"
authors = ["Luke"]
description = "An AI-native version control system"
license = "Apache-2.0"
repository = "https://github.com/HeddleCo/heddle"
keywords = ["vcs", "version-control", "ai", "git"]
categories = ["development-tools"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base32 = "0.5"
base64 = "0.22"
biscuit-auth = "6"
blake3 = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
ed25519-dalek = { version = "3", features = ["pem", "rand_core"] }
fs2 = "0.4.3"
fastembed = { version = "=5.17.4", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
futures = "0.3"
getrandom = { version = "0.4", features = ["sys_rng"] }
sley = { version = "0.7.0", features = ["mmap", "fast-sha1"] }
sley-transport = "0.7.0"
hex = "0.4"
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
ignore = "0.4"
iroh = { package = "heddleco-iroh", version = "0.1.0", default-features = false, features = ["tls-ring", "unstable-custom-transports", "unstable-custom-transport-backpressure"] }
iroh-base = "=1.0.3"
libc = "0.2"
lru = "0.18"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
memmap2 = "0.9"
n0-watcher = "=1.0.0"
notify = "8"
ntest = "0.9"
noq-udp = { version = "=1.1.1", default-features = false }
proptest = "1"
p256 = { version = "0.14", features = ["ecdsa", "pem", "getrandom"] }
pkcs8 = { version = "0.11", features = ["pem", "encryption"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
prost = "0.14"
prost-reflect = "0.16"
prost-types = "0.14"
protoc-bin-vendored = "3"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics"] }
opentelemetry_sdk = "0.32"
rand = "0.10"
regex-lite = "0.1"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rmp-serde = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
schemars = { version = "1.2", features = ["chrono04"] }
sec1 = { version = "0.8", features = ["pem"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_bytes = "0.11"
serde_json = "1"
serial_test = "3"
sha2 = { version = "0.11", features = ["oid"] }
similar = "3"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
pollster = "0.4"
tempfile = "3"
thiserror = "2"
# Tokio is centralized here so optional crate opt-ins cannot resolve a
# weaker runtime than the CLI-level feature union needs. Member crates
# should use `tokio.workspace = true` (or `dep:tokio` for optional
# features) and only add local Tokio features when a new actual API need
# is not already covered by this baseline.
tokio = { version = "1", default-features = false, features = [
    "rt",          # current_thread runtime
    "macros",      # #[tokio::main], select!, pin!, join!
    "net",         # Unix sockets for daemon/agent
    "signal",      # ctrl_c for daemon shutdown
    "sync",        # mpsc channels
    "time",        # sleep, timeout
    "io-util",     # AsyncReadExt / AsyncWriteExt
    "process",     # tokio::process for harness subprocesses
    "fs",          # async filesystem ops in some daemons
    "rt-multi-thread", # hosted daemon binary uses multi-thread runtime
] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
toml = "1.1"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
# Exact pin: unlike the 0.x grammars (where caret pins the minor), a caret on
# this >=1.0 crate would admit 1.2+, changing parse trees without matching the
# `@1.1` version recorded in semantic_index.rs — so a `cargo update` could drift
# `semantic_hash` with no version-bust. Bump this and the recorded version together.
tree-sitter-zig = "=1.1.2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
walkdir = "2"
wait-timeout = "0.2"
webpki-roots = "1.0"
windows-sys = "0.61"
zstd = "0.13"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
lto = true
codegen-units = 1
strip = true

# release-plz config for the Heddle OSS workspace.
#
# Synchronises per-crate semver across the OSS crates. release-plz
# walks the workspace dependency graph and publishes in topological
# order, opening release PRs that bump versions and update changelogs.

[workspace]
release = true
dependencies_update = true
git_release_enable = true
publish_allow_dirty = false

# Publishable OSS crates — all release = true.
[[package]]
# Parked — not published to crates.io until the treadle stack is
# actually built. Nothing in the heddle graph depends on it; its
# first-publish 403'd (crates.io token can update existing heddle-*
# crates but can't create a new crate) and blocked the whole 0.19
# release. Stays a hosted/buildable workspace member.
name = "treadle-schema"
release = false

[[package]]
name = "heddle-format"
release = true


name: Shared capability verifiers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crates/capability-verifier

jobs:
  native:
    name: Native test, conformance, and clippy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Native unit and conformance suite
        run: cargo test --locked -p heddleco-capability-verifier -p heddle-biscuit-verifier --all-targets -- --nocapture
      - name: Keep signing and verification dependencies narrow
        run: python3 ../../.github/check_leaf_dependencies.py
      - name: Verify publish inventory and dependency order
        run: ../../scripts/check-publish-pipeline.sh
      - name: Clippy
        run: cargo clippy --locked -p heddleco-capability-verifier -p heddle-biscuit-verifier --all-targets -- -D warnings
      - name: Public crate documentation
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --locked -p heddleco-capability-verifier -p heddle-biscuit-verifier --no-deps

  wasm:
    name: Worker WASM build and parity
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Worker target for the workspace toolchain
        # Heddle pins a toolchain in rust-toolchain.toml. A target installed
        # for the action's stable toolchain does not install it for that pin.
        run: rustup target add wasm32-unknown-unknown
      - name: Install the WASM test runner
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build Worker target
        run: cargo build --locked -p heddleco-capability-verifier --target wasm32-unknown-unknown --lib
      - name: Check ordinary verifier independently
        run: cargo check --locked -p heddle-biscuit-verifier --target wasm32-unknown-unknown --lib
      - name: Run the full fixture matrix in WASM
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --locked -p heddleco-capability-verifier --target wasm32-unknown-unknown --lib -- --nocapture

  publish-packages:
    name: crates.io package surfaces
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # API 0.31 and the ordinary verifier are first-publish dependencies.
      # The main-only publish workflow validates and publishes the registry
      # graph in dependency order; PRs can still verify both exact file sets.
      - name: Verify the ordinary verifier package surface
        run: cargo package -p heddle-biscuit-verifier --list
      - name: Verify the owner verifier package surface
        run: cargo package -p heddleco-capability-verifier --list

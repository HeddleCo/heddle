name: Rust Fast Lane

# The only runner-paying CI lane on a normal PR push. Build every workspace
# target so integration/e2e targets still compile, but execute only library and
# binary unit tests; service-backed, ignored, and CLI integration suites belong
# to rust-full-suite.yml.

on:
  pull_request:
    branches:
      - main
  # Branch protection may require fast-check for both PRs and merge groups.
  # Emit the same stable success context in the queue without duplicating the
  # compilation already performed by rust-full-suite.yml.
  merge_group:
    types: [checks_requested]

concurrency:
  group: rust-fast-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes should stop; merge groups are independent queue
  # candidates and must never cancel one another.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

# Run every `run:` step under `bash --noprofile --norc -eo pipefail`
# instead of the default `bash -e`. Without `pipefail`, a non-zero
# exit from any command piped into `tee` is masked by `tee`'s success.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  # sccache caches to LOCAL DISK, not the GitHub Actions (Azure-backed) cache.
  # The Blacksmith self-hosted runners can't DNS-resolve the GHA cache's Azure
  # blob backend, so SCCACHE_GHA_ENABLED=true hard-fails the job (exit 74) at
  # sccache startup/stats. Cross-run target/ caching still comes from
  # Swatinem/rust-cache, which Blacksmith transparently accelerates.
  SCCACHE_GHA_ENABLED: "false"

jobs:
  fast-check:
    name: fast-check
    runs-on: [self-hosted, linux, x64, heddleco]
    timeout-minutes: 30
    env:
      # GNU ld dominates the tail of the workspace-wide, all-targets links
      # this lane performs; LLVM lld is substantially faster. No heddle Rust
      # job builds a wasm32 target, so this native-linker flag is safe
      # workspace-wide here. Set at job scope so build, clippy, and the unit
      # test link all use it. Kept identical to the full lane's Quality job so
      # the two continue to share one rust-cache slot (rust-cache folds RUST*
      # env into its key).
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

    steps:
      - name: Satisfy fast-check on the merge queue
        if: github.event_name == 'merge_group'
        run: echo "full-suite owns Rust validation for merge groups"

      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'

      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'pull_request'
        with:
          # Pin so a silent stable bump does not invalidate rust-cache. Matches
          # rust-toolchain.toml, which already forces this channel at build
          # time; pinning the installed default keeps rust-cache's rustc probe
          # aligned with it so the cache stays warm across stable releases.
          toolchain: "1.98.0"
          components: clippy

      - name: Ensure LLVM linker
        if: github.event_name == 'pull_request'
        run: |
          if ! command -v ld.lld; then
            sudo apt-get update
            sudo apt-get install -y lld
          fi

      - uses: mozilla-actions/sccache-action@v0.0.9
        if: github.event_name == 'pull_request'

      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'pull_request'
        with:
          # Shared with the full lane's default-feature Quality job so both
          # lanes reuse each other's dependency artifacts. Arch-qualified so an
          # x86 and an arm runner never collide on one slot; prefix bumps the
          # whole namespace when needed; cache-all-crates keeps registry deps
          # warm across lanes.
          shared-key: rust-ws-${{ runner.os }}-${{ runner.arch }}
          prefix-key: v1-rust-incr
          cache-on-failure: true
          cache-all-crates: true

      - name: Rust source reachability and dead-code blankets
        if: github.event_name == 'pull_request'
        run: cargo run --locked -p heddle-devtools -- check-rust-source-reachability

      - name: Build (workspace, all targets)
        if: github.event_name == 'pull_request'
        run: cargo build --locked --workspace --all-targets

      - name: Clippy (workspace, all targets)
        if: github.event_name == 'pull_request'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings -D dead-code

      - name: Unit tests (workspace, lib + bins)
        if: github.event_name == 'pull_request'
        run: cargo test --locked --workspace --lib --bins

      - name: sccache stats
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: sccache --show-stats

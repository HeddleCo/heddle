name: Thread API

on:
  pull_request:
    paths:
      - 'crates/thread-api/**'
      - 'crates/repo/src/thread_replication/**'
      - 'crates/object-model/src/object/thread_replication.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/thread-client-experiment.yml'

permissions:
  contents: read

jobs:
  thread-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo test --locked -p heddle-thread-api
      - run: cargo clippy --locked -p heddle-thread-api --all-targets -- -D warnings
      - run: cargo run --locked -p heddle-thread-api --example thread

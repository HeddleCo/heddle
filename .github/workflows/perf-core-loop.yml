name: Core Loop Performance

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: perf-core-loop-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs should stop; merge groups are independent queue
  # candidates and must never cancel one another.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "false"
  TMPDIR: /home/scratch
  HEDDLE_PERF_BASELINE: ci-blacksmith-4vcpu-ubuntu-2404

jobs:
  release-contract:
    name: Release contract (10k/100k)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: perf-core-loop-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true

      - name: Prepare benchmark scratch space
        run: |
          sudo mkdir -p /home/scratch
          sudo chown "$(id -u):$(id -g)" /home/scratch

      - name: Compile release harness (out of band)
        run: |
          set -o pipefail
          /usr/bin/time -f 'release_compile elapsed=%e user=%U sys=%S max_rss_kb=%M' \
            cargo build --locked --release -p heddle-cli \
              --bin heddle --bin heddle-fsmonitor-worker 2>&1 | tee release-compile.txt
          /usr/bin/time -f 'release_test_compile elapsed=%e user=%U sys=%S max_rss_kb=%M' \
            cargo test --locked --release -p heddle-cli --test cli_basics \
              --no-run 2>&1 | tee -a release-compile.txt
          /usr/bin/time -f 'release_history_test_compile elapsed=%e user=%U sys=%S max_rss_kb=%M' \
            cargo test --locked --release -p heddle-repo --lib \
              --no-run 2>&1 | tee -a release-compile.txt
          /usr/bin/time -f 'release_hosted_close_compile elapsed=%e user=%U sys=%S max_rss_kb=%M' \
            cargo test --locked --release -p heddle-cli --lib \
              --no-run 2>&1 | tee -a release-compile.txt

      - name: Enforce instant core-loop contract
        run: |
          set -o pipefail
          cargo test --locked --release -p heddle-cli --test cli_basics \
            perf_core_loop::core_loop_release_contract -- --ignored --nocapture 2>&1 | tee core-loop-contract.txt

      - name: Enforce bounded-history contract
        run: |
          set -o pipefail
          HEDDLE_PROFILE=1 cargo test --locked --release -p heddle-repo --lib \
            bounded_history_reads_release_contract -- --ignored --nocapture \
            2>&1 | tee history-contract.txt

      - name: Enforce adopt no-eager-mirror contract
        run: |
          set -o pipefail
          HEDDLE_PROFILE=1 cargo test --locked --release -p heddle-cli \
            --test cli_basics perf_adopt::adopt_no_eager_mirror_release_contract \
            -- --ignored --nocapture 2>&1 | tee adopt-contract.txt

      - name: Enforce hosted endpoint close contract
        run: |
          set -o pipefail
          RUST_LOG=iroh=error cargo test --locked --release -p heddle-cli --lib \
            hosted_endpoint_close_release_contract -- --ignored --nocapture \
            2>&1 | tee hosted-close-contract.txt
          if grep -Fq 'Endpoint dropped without calling `Endpoint::close`' \
            hosted-close-contract.txt; then
            echo 'HOSTED_CLOSE_LEAK_GUARD red: endpoint was dropped ungracefully'
            exit 1
          fi
          echo 'HOSTED_CLOSE_LEAK_GUARD green'

      - name: Publish contract summary
        if: always()
        run: |
          {
            echo '## Instant core-loop release contract'
            echo
            echo 'Compilation and fixture construction are reported separately from command samples.'
            echo
            echo '```text'
            grep -E '^(RUNNER|SETUP|RESULT|COUNTERS|BASELINE|BAND|TARGET|SCALE|GATES|PERF GATE)' \
              core-loop-contract.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## Bounded-history release contract'
            echo
            echo '```text'
            grep -E '^(HISTORY_GATE|HISTORY_NEGATIVE_CONTROL|HISTORY GATE)' \
              history-contract.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## Hosted endpoint close release contract'
            echo
            echo '```text'
            grep -E '^(HOSTED_CLOSE|HOSTED CLOSE GATE)' \
              hosted-close-contract.txt 2>/dev/null || true
            echo '```'
            echo
            echo '## Adopt no-eager-mirror release contract'
            echo
            echo '```text'
            grep -E '^(ADOPT_GATE|ADOPT GATE)' adopt-contract.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-loop-release-contract
          path: |
            release-compile.txt
            core-loop-contract.txt
            history-contract.txt
            adopt-contract.txt
            hosted-close-contract.txt

      - name: sccache stats
        if: always()
        run: sccache --show-stats

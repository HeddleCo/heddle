name: Windows release check

on:
  pull_request:
    branches: [main, integration]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/windows-check.yml'
      - '.github/workflows/release.yml'

concurrency:
  group: windows-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-check:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release-check
      - name: Check release binaries with Windows mount and client support
        run: cargo check --release --locked -p heddle-cli --features mount,client --target x86_64-pc-windows-msvc --bins
      - name: Credential helper fallback tests
        run: cargo test --locked -p heddle-git-projection --lib credential -- --test-threads=1

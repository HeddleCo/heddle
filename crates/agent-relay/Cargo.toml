[package]
name = "heddle-agent-relay"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
config.workspace = true
heddle-cli-render.workspace = true
hosted-client.workspace = true
ingest.workspace = true
objects.workspace = true
refs.workspace = true
repo.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
verbs.workspace = true
wire.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lib]
name = "agent_relay"
path = "src/lib.rs"

[features]
# Mirrors the CLI's `client` marker: the hosted stack compiles inside
# `hosted-client`; enabling this turns on its client-gated surfaces so the
# relay can infer session identity from the active bearer token.
client = ["hosted-client/client"]

[package]
name = "heddle-agent-relay"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
config = { path = "../config", package = "heddle-config", version = "0.15.0" }
heddle-cli-render = { path = "../cli-render", version = "0.15.0", default-features = false }
hosted-client = { path = "../hosted-client", package = "heddle-hosted-client", version = "0.15.0", default-features = false }
ingest = { path = "../ingest", package = "heddle-ingest", version = "0.15.0", default-features = false }
objects = { path = "../objects", package = "heddle-objects", version = "0.15.0" }
refs = { path = "../refs", package = "heddle-refs", version = "0.15.0" }
repo = { path = "../repo", package = "heddle-repo", version = "0.15.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
verbs = { path = "../verbs", package = "heddle-verbs", version = "0.15.0", default-features = false }
wire = { path = "../wire", package = "heddle-wire", version = "0.15.0", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[lib]
name = "agent_relay"
path = "src/lib.rs"

[features]
# Mirrors the CLI's `client` marker: the hosted stack compiles inside
# `hosted-client`; enabling this turns on its client-gated surfaces so the
# relay can infer session identity from the active bearer token.
client = ["hosted-client/client"]

[package]
name = "heddle-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Heddle local typed review implementation"
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
chrono.workspace = true
crypto.workspace = true
hex.workspace = true
objects.workspace = true
repo = { workspace = true, features = ["git-overlay", "native"] }
serde.workspace = true
serde_json.workspace = true
state_review.workspace = true

semantic = { workspace = true, optional = true }

[dev-dependencies]
objects = { workspace = true, features = ["memory-backend"] }
proptest.workspace = true
serial_test.workspace = true
tempfile.workspace = true
tokio.workspace = true

[features]
default = []
semantic = ["dep:semantic", "repo/tree-sitter-symbols"]

[lib]
path = "src/lib.rs"
name = "daemon"

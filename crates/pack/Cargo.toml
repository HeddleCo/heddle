[package]
name = "heddle-pack"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Heddle's pack and delta storage format."
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
blake3.workspace = true
bytes.workspace = true
heddle-format.workspace = true
heddle-fs-prims = { workspace = true, optional = true }
heddle-object-model.workspace = true
memmap2.workspace = true
rmp-serde.workspace = true
tracing.workspace = true
zstd = { workspace = true, optional = true }

[features]
default = ["fs"]
fs = ["dep:heddle-fs-prims"]
zstd = ["dep:zstd", "heddle-format/zstd"]

[dev-dependencies]
tempfile.workspace = true

[lib]
path = "src/lib.rs"
name = "heddle_pack"

[package]
name = "heddle-verbs"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
crypto.workspace = true
fs2.workspace = true
merge.workspace = true
ignore.workspace = true
hex.workspace = true
objects.workspace = true
heddle-git-projection.workspace = true
oplog.workspace = true
refs.workspace = true
repo = { workspace = true, features = ["default"] }
rmp-serde.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
semantic = { workspace = true, optional = true }
sley.workspace = true
state_review.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
default = []
# Forward zstd through the Git projection dependency when the workspace
# enables compression (CLI `zstd` feature wires this).
zstd = ["heddle-git-projection/zstd", "repo/zstd", "objects/zstd"]
semantic = ["dep:semantic", "repo/tree-sitter-symbols"]
semantic-extended = ["semantic", "semantic?/extended-languages"]

[dev-dependencies]
serial_test.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lib]
path = "src/lib.rs"
name = "verbs"

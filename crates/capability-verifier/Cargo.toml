[package]
name = "heddleco-capability-verifier"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
authors.workspace = true
description = "Pure owner-anchored capability verification shared by Heddle and Weft"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = [
  "/src/**",
  "/tests/**",
  "/conformance/**",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
heddle-biscuit-verifier = { path = "../biscuit-verifier", version = "0.28.6" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
biscuit-auth = { version = "6.0", default-features = false, features = ["datalog-macro"] }
ed25519-dalek = { version = "3.0", default-features = false, features = ["alloc", "fast"] }
heddle-api = "=0.31.0-alpha.18"
hex = "0.4"
prost = "0.14"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser bindings and the browser clock backend must not enter native hosts.
biscuit-auth = { version = "6.0", default-features = false, features = ["datalog-macro", "wasm"] }
# biscuit-auth links its token builder even for verification-only consumers.
# Enabling its transitive entropy backend makes that pure code linkable in a
# browser Worker; this crate never calls a randomness API.
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.127"

[dev-dependencies]
wasm-bindgen-test = "=0.3.77"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

# Current Rust emits bulk-memory and saturating float-to-int instructions.
# Keep wasm-pack's optimizer aligned with the target features it validates.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

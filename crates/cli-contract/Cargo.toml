[package]
name = "heddle-cli-contract"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Heddle's CLI verb catalog, schemas, help, and recovery contract."
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
heddle-cli-args.workspace = true
heddle-cli-render.workspace = true
heddle-core.workspace = true
heddle-git-projection.workspace = true
objects.workspace = true
refs.workspace = true
repo.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sley.workspace = true
tracing.workspace = true

[features]
default = ["client", "git-overlay", "ingest", "semantic"]
client = ["heddle-cli-args/client", "heddle-cli-render/client"]
git-overlay = ["heddle-cli-args/git-overlay", "repo/git-overlay"]
ingest = ["heddle-cli-args/ingest"]
semantic = [
    "heddle-cli-args/semantic",
    "heddle-core/semantic",
    "repo/tree-sitter-symbols",
]

[dev-dependencies]
tempfile.workspace = true

[lib]
path = "src/lib.rs"
name = "heddle_cli_contract"

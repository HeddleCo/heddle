[package]
name = "heddle-objects"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow.workspace = true
base32.workspace = true
blake3.workspace = true
bytes.workspace = true
chrono.workspace = true
fs2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
heddle-fs-prims = { workspace = true, optional = true }
heddle-format.workspace = true
heddle-object-model.workspace = true
heddle-pack.workspace = true
heddle-perf-contract.workspace = true
ignore.workspace = true
libc = "0.2"
memmap2 = { workspace = true, optional = true }
rand.workspace = true
rmp-serde.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
sley-core.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[features]
async-source = ["heddle-object-model/async-source"]
bench = ["fs", "heddle-format/bench"]
default = ["fs"]
fs = [
    "dep:fs2",
    "dep:heddle-fs-prims",
    "dep:hex",
    "dep:memmap2",
    "dep:tracing",
    "dep:uuid",
    "heddle-pack/fs",
]
memory-backend = []
zstd = [
    "dep:zstd",
    "heddle-format/zstd",
    "heddle-object-model/zstd",
    "heddle-pack/zstd",
]

[dev-dependencies]
criterion = "0.8"
tempfile.workspace = true
proptest.workspace = true

[lib]
path = "src/lib.rs"
name = "objects"

[[test]]
name = "ancestry_final_read"
required-features = ["async-source"]

[[bench]]
name = "hashing"
harness = false
required-features = ["bench"]

[[bench]]
name = "compression"
harness = false
required-features = ["bench"]

[[bench]]
name = "pack_io"
harness = false
required-features = ["bench", "fs"]

[[bench]]
name = "object_enumeration"
harness = false
required-features = ["bench", "fs"]

[[bench]]
name = "tree_diff"
harness = false
required-features = ["bench"]

[[bench]]
name = "line_diff_blame"
harness = false
required-features = ["bench", "memory-backend"]

[[bench]]
name = "tree_stream"
harness = false
required-features = ["bench"]

[[example]]
name = "train_tree_state_dictionary"
required-features = ["zstd"]

[[example]]
name = "htr4_measure"
required-features = ["zstd"]

[[example]]
name = "delta_encoding_spike"
required-features = ["bench", "zstd"]

[[bench]]
name = "delta"
harness = false
required-features = ["bench"]

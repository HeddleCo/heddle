[package]
name = "heddle-objects"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow.workspace = true
base32.workspace = true
blake3.workspace = true
bytes.workspace = true
chrono.workspace = true
fs2.workspace = true
hex.workspace = true
heddle-fs-prims.workspace = true
heddle-format.workspace = true
heddle-object-model.workspace = true
heddle-pack.workspace = true
heddle-perf-contract.workspace = true
ignore.workspace = true
libc = "0.2"
memmap2.workspace = true
rand.workspace = true
rmp-serde.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
sley.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
zstd = { workspace = true, optional = true }

[features]
async-source = ["heddle-object-model/async-source"]
bench = ["heddle-format/bench"]
memory-backend = []
zstd = ["dep:zstd", "heddle-format/zstd", "heddle-pack/zstd"]

[dev-dependencies]
criterion = "0.8"
tempfile.workspace = true
proptest.workspace = true

[lib]
path = "src/lib.rs"
name = "objects"

[[bench]]
name = "hashing"
harness = false
required-features = ["bench"]

[[bench]]
name = "compression"
harness = false
required-features = ["bench"]

[[bench]]
name = "pack_io"
harness = false
required-features = ["bench"]

[[bench]]
name = "object_enumeration"
harness = false
required-features = ["bench"]

[[bench]]
name = "tree_diff"
harness = false
required-features = ["bench"]

[[bench]]
name = "line_diff_blame"
harness = false
required-features = ["bench", "memory-backend"]

[[bench]]
name = "tree_stream"
harness = false
required-features = ["bench"]

[[example]]
name = "train_tree_state_dictionary"
required-features = ["zstd"]

[[bench]]
name = "delta"
harness = false
required-features = ["bench"]

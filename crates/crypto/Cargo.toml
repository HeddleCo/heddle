[package]
name = "heddle-crypto"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = { workspace = true, optional = true }
api = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
heddleco-capability-verifier = { path = "../capability-verifier", version = "0.21.1", optional = true }
aes-gcm.workspace = true
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hex.workspace = true
hkdf.workspace = true
heddle-object-model.workspace = true
p256.workspace = true
prost = { workspace = true, optional = true }
pkcs8.workspace = true
sec1.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid = { workspace = true, optional = true }
x25519-dalek.workspace = true
zeroize.workspace = true

[dev-dependencies]
heddle-fs-prims.workspace = true
tempfile.workspace = true

[lib]
path = "src/lib.rs"
name = "crypto"

[features]
owner-root = ["dep:anyhow", "dep:api", "dep:blake3", "dep:heddleco-capability-verifier", "dep:prost", "dep:uuid"]

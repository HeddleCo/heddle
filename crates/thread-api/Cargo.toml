[package]
name = "heddle-thread-api"
version.workspace = true
edition.workspace = true
description = "Native Thread clients and durable peer replication over Iroh"
license.workspace = true
repository.workspace = true

[features]
default = ["native", "iroh"]
# Durable replication and the host's ordinary Biscuit authorization boundary.
native = [
    "replication",
    "dep:repo",
    "dep:objects",
    "dep:crypto",
    "dep:biscuit-verifier",
    "dep:base64",
    "dep:chrono",
    "dep:uuid",
    "dep:hex",
    "dep:tokio",
    "dep:tempfile",
]
# An Iroh adapter for the transport-neutral client and replication driver.
iroh = ["dep:iroh", "dep:tokio", "dep:heddle-perf-contract"]
# Causal protocol and async stream driver, without a local repository or Iroh.
replication = ["signing", "dep:heddle-object-model", "dep:tokio"]
# Portable exact-request verification; hosts retain authority and nonce storage.
signing = ["dep:crypto", "dep:hex"]

[dependencies]
base64 = { workspace = true, optional = true }
api.workspace = true
repo = { workspace = true, optional = true, features = ["native", "git-overlay"] }
objects = { workspace = true, optional = true }
crypto = { workspace = true, optional = true }
heddle-object-model = { workspace = true, optional = true }
biscuit-verifier = { package = "heddle-biscuit-verifier", path = "../biscuit-verifier", version = "0.21.0", optional = true }
chrono = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
heddle-perf-contract = { workspace = true, optional = true }
blake3.workspace = true
hex = { workspace = true, optional = true }
iroh = { package = "heddleco-iroh", version = "=0.1.0", default-features = false, features = ["tls-ring"], optional = true }
prost = "=0.14.1"
thiserror = "=2.0.18"
tokio = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
anyhow = "1"
biscuit-auth.workspace = true
ed25519-dalek = "3"
getrandom = "0.4"
hex.workspace = true
tempfile.workspace = true

[[example]]
name = "thread"
required-features = ["iroh"]

[[example]]
name = "multiplex"
required-features = ["iroh"]

[[test]]
name = "thread_workflow"
required-features = ["iroh"]

[[test]]
name = "transport_observation"
required-features = ["iroh"]
